<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Radial / Linear Gradient in Athletic Emerald & Ocean Blue -->
    <linearGradient id="ffGradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="ffGradPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#16c79a" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <!-- Filter for subtle drop glow -->
    <filter id="ffGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#16c79a" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Outer Ring Accent -->
  <circle cx="60" cy="60" r="57" fill="none" stroke="rgba(22, 199, 154, 0.3)" stroke-width="2" />

  <!-- Base Rounded Container / Circle -->
  <rect x="8" y="8" width="104" height="104" rx="30" fill="url(#ffGradBg)" stroke="rgba(22, 199, 154, 0.4)" stroke-width="2" />

  <!-- Inner Soft Translucent Glass Ring -->
  <rect x="14" y="14" width="92" height="92" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- AI Neural Network Nodes & Constellation Grid -->
  <g opacity="0.45">
    <line x1="28" y1="36" x2="60" y2="24" stroke="#5eead4" stroke-width="1.2" stroke-dasharray="2 3" />
    <line x1="92" y1="36" x2="60" y2="24" stroke="#5eead4" stroke-width="1.2" stroke-dasharray="2 3" />
    <line x1="28" y1="84" x2="60" y2="96" stroke="#5eead4" stroke-width="1.2" stroke-dasharray="2 3" />
    <line x1="92" y1="84" x2="60" y2="96" stroke="#5eead4" stroke-width="1.2" stroke-dasharray="2 3" />
    <circle cx="28" cy="36" r="3" fill="#38bdf8" />
    <circle cx="92" cy="36" r="3" fill="#16c79a" />
    <circle cx="28" cy="84" r="3" fill="#34d399" />
    <circle cx="92" cy="84" r="3" fill="#2dd4bf" />
  </g>

  <!-- Official FitFuel Heartbeat Pulse / Athletic Activity Wave (Matches Brand Mark) -->
  <path d="M22 60 h15 l8 24 16 -48 12 36 8 -12 h17" fill="none" stroke="url(#ffGradPulse)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#ffGlow)" />

  <!-- Sparkle Accent in top-right -->
  <path d="M88 28 Q88 34 94 34 Q88 34 88 40 Q88 34 82 34 Q88 34 88 28 Z" fill="#16c79a" opacity="0.9" />
</svg>
